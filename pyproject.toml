[project]
name = "leadgen-backend"
version = "0.1.0"
description = "Phase 1 customer-centric CRM backend for Leadgen"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.30",
  "sqlalchemy[asyncio]>=2.0.36",
  "asyncpg>=0.30",
  "alembic>=1.14",
  "pydantic-settings>=2.6",
  "pydantic[email]>=2.9",
  "python-jose[cryptography]>=3.3",
  "pwdlib[argon2]>=0.2",
  "phonenumbers>=8.13",
  "python-multipart>=0.0.18",
]
[project.optional-dependencies]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24", "httpx>=0.27", "ruff>=0.8"]
[tool.ruff]
line-length = 100
target-version = "py311"
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
